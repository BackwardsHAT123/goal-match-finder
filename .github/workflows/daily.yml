name: Daily refresh

on:
  schedule:
    - cron: "0 12 * * *"   # 12:00 UTC daily (6am Mountain)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest
      - name: Build page
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python finder.py --days 7
      # Pages on a private repo needs a paid plan, so the page is kept as a downloadable artifact.
      # On a plan with private Pages, swap this step for actions/upload-pages-artifact + actions/deploy-pages.
      - uses: actions/upload-artifact@v4
        with:
          name: goal-match-finder
          path: site
          retention-days: 14
